# cargo-deny configuration.
#
# Run locally with:  cargo deny check
# Run in CI by:      .github/workflows/security.yml
#
# Purpose: keep the dependency tree compatible with the project's dual licence,
# free of known advisories, and sourced only from crates.io. Anything that
# cannot satisfy these rules needs a deliberate decision, not a silent pass.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licences only. Strong copyleft (GPL, AGPL) is deliberately absent:
# the project is dual-licensed MIT OR Apache-2.0 and must stay usable under both.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "Unlicense",
]
confidence-threshold = 0.9
# The allow list is a policy statement — which licences this project accepts —
# not a description of the current dependency tree. An entry that no crate uses
# today is expected to be unused, so that is not reported as a problem.
unused-allowed-license = "allow"
exceptions = []

[bans]
multiple-versions = "warn"
# External crates must state a version. Internal path dependencies legitimately
# have none — the workspace pins them by path — so those are exempt.
wildcards = "deny"
allow-wildcard-paths = true
deny = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
